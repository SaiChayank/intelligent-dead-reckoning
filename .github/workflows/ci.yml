name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The app never uses the network; CI needs it only to fetch dependencies.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — tests, contracts, session reader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Contract tests
        run: python -B -X utf8 -W error::ResourceWarning -m unittest discover -s tests -p "test_*contract*.py" -v
      - name: Python session-reader tests
        run: |
          python -B -X utf8 -W error::ResourceWarning -m unittest discover -s tests -p "test_recording_session.py" -v
          python -B -X utf8 -W error::ResourceWarning -m unittest discover -s tests -p "test_validate_phone_recording.py" -v
      - name: Experiment contract, loader and tooling tests
        # Synthetic experiments only; no collected drive and no device is involved.
        run: python -B -X utf8 -W error::ResourceWarning -m unittest discover -s tests -p "test_experiment*.py" -v
      - name: Unit tests (full suite)
        run: python -B -X utf8 -W error::ResourceWarning -m unittest discover -s tests
      - name: Compile and import checks
        run: |
          python -B -X utf8 -c "import ast; from pathlib import Path; files=[p for d in ('training','tests','contracts','tools') for p in Path(d).rglob('*.py')]; [ast.parse(p.read_text(encoding='utf-8-sig'),filename=str(p)) for p in files]; print('Parsed',len(files),'Python files')"
          python -B -X utf8 -c "import contracts.v1.models, contracts.v1.codec, contracts.recording.v1.session, contracts.experiment.v1.codec, contracts.experiment.v1.integrity, contracts.experiment.v1.masking, contracts.experiment.v1.experiment, tools.validate_phone_recording, tools.validate_experiment, tools.experiment_report, tools.seal_experiment, tools.parity_probe, training.common; print('imports ok')"

  android:
    name: Android — JVM tests, lint, debug builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      # 25 matches the verified local toolchain (Android Studio JBR 25.0.3);
      # bytecode still targets 17 as declared in build.gradle.kts.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Ensure Android SDK platform and build tools
        # sdkmanager is not on PATH on hosted runners (exit 127), so call it in
        # place. The step warms the SDK; AGP can auto-download anything missing,
        # so a runner without sdkmanager degrades to a notice instead of a failure.
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM=""
          for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then
              SM="$c"
              break
            fi
          done
          if [ -z "$SM" ] && [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$SM" ]; then
            echo "::notice::sdkmanager unavailable on this runner; AGP will download any SDK components the build needs"
            exit 0
          fi
          if ! "$SM" --list_installed | grep -q "platforms;android-37"; then
            # Hosted runners ship accepted licences; `yes` covers any new prompt.
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            yes | "$SM" "platforms;android-37" > /dev/null
            # Build tools are a cache warm-up only: AGP picks its own version and
            # auto-downloads it, so an unavailable version must not fail the job.
            yes | "$SM" "build-tools;36.0.0" > /dev/null || true
          fi
          "$SM" --list_installed | grep -E "platforms;android-37|build-tools;" || true
          "$SM" --list_installed | grep -q "platforms;android-37"
      # PythonParityTest drives tools/parity_probe.py during the JVM suite.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # gradlew is tracked without its executable bit; bash runs it regardless.
      - name: JVM tests (includes Kotlin/Python session-reader parity)
        run: bash gradlew testDebugUnitTest --console=plain
      - name: Lint
        run: bash gradlew lintDebug --console=plain
      - name: Assemble debug APK
        run: bash gradlew assembleDebug --console=plain
      - name: Assemble instrumented test APK (compiles the device suite; nothing is run)
        run: bash gradlew assembleDebugAndroidTest --console=plain

  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Whitespace check (git diff --check over the pushed range)
        # Scoped to the change on purpose: historical evidence files and shipped
        # licences contain deliberate trailing whitespace and must not be
        # reformatted. cr-at-eol keeps the repo's CRLF files out of the report.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          echo "whitespace check range: $base..HEAD"
          git -c core.whitespace=cr-at-eol diff --check "$base" HEAD
      - name: Tracked-file policy, secret scan, artifact/schema validation
        run: python tools/check_repo_hygiene.py
